<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>鹈鹕骑自行车</title>
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      background: linear-gradient(#6eb0d8 0%, #d5eef8 30%, #ffe6bf 54%, #2f7f90 72%, #2c343a 100%);
    }

    body {
      display: grid;
      place-items: center;
    }

    svg {
      width: 100vw;
      height: 100vh;
      display: block;
    }

    .lane {
      stroke-dasharray: 36 58.25;
      animation: roll 0.6s linear infinite;
    }

    .chain {
      stroke-dasharray: 4 3.5;
      animation: drive-chain 0.28s linear infinite;
    }

    @keyframes roll {
      to {
        stroke-dashoffset: -377;
      }
    }

    @keyframes drive-chain {
      to {
        stroke-dashoffset: -15;
      }
    }
  </style>
</head>
<body>
  <!--
    Seaside loop: the road scrolls left while the wheels turn clockwise.
    Leg keys are a 12-frame cycle. Hip is the local origin, thigh 58,
    shin 54, bottom bracket at (18, 72), pedal radius 22.
    Crank, pedals, and both legs share a 0.9s duration.
  -->
